name: Naukri Resume Update

on:
  workflow_dispatch: # allows manual trigger
  schedule:
    - cron: '0 0 * * *' # runs daily at midnight UTC

jobs:
  update-naukri:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium selenium-stealth

    - name: Install Chrome
      run: |
        sudo apt update
        sudo apt install -y chromium-browser chromium-chromedriver
        export CHROME_BIN=/usr/bin/chromium-browser
        export CHROME_DRIVER=/usr/bin/chromedriver

    - name: Run Naukri Update Script
      env:
        NAUKRI_EMAIL_1: ${{ secrets.NAUKRI_EMAIL_1 }}
        NAUKRI_PASSWORD_1: ${{ secrets.NAUKRI_PASSWORD_1 }}
        NAUKRI_EMAIL_2: ${{ secrets.NAUKRI_EMAIL_2 }}
        NAUKRI_PASSWORD_2: ${{ secrets.NAUKRI_PASSWORD_2 }}
        NAUKRI_EMAIL_3: ${{ secrets.NAUKRI_EMAIL_3 }}
        NAUKRI_PASSWORD_3: ${{ secrets.NAUKRI_PASSWORD_3 }}
      run: |
        xvfb-run -a python ./naukri_update.py
