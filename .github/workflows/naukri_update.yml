name: Naukri Resume Auto Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"  # daily at 06:00 IST (00:30 UTC)

jobs:
  update-naukri:
    runs-on: ubuntu-latest
    env:
      NAUKRI_EMAIL_1: ${{ secrets.NAUKRI_EMAIL_1 }}
      NAUKRI_PASSWORD_1: ${{ secrets.NAUKRI_PASSWORD_1 }}
      NAUKRI_EMAIL_2: ${{ secrets.NAUKRI_EMAIL_2 }}
      NAUKRI_PASSWORD_2: ${{ secrets.NAUKRI_PASSWORD_2 }}
      NAUKRI_EMAIL_3: ${{ secrets.NAUKRI_EMAIL_3 }}
      NAUKRI_PASSWORD_3: ${{ secrets.NAUKRI_PASSWORD_3 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      - name: Create screenshots folder
        run: mkdir -p screenshots

      - name: Run Naukri update script
        run: python3 naukri_update.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
