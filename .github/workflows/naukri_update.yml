name: update-naukri

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"  # Runs every day at 6:00 AM IST (00:30 UTC)

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium selenium-stealth webdriver-manager

      - name: Install Chrome and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser chromium-chromedriver
          which chromedriver
          which chromium-browser

      - name: Run Naukri Resume Updater
        env:
          NAUKRI_EMAIL_1: ${{ secrets.NAUKRI_EMAIL_1 }}
          NAUKRI_PASSWORD_1: ${{ secrets.NAUKRI_PASSWORD_1 }}
          NAUKRI_EMAIL_2: ${{ secrets.NAUKRI_EMAIL_2 }}
          NAUKRI_PASSWORD_2: ${{ secrets.NAUKRI_PASSWORD_2 }}
          NAUKRI_EMAIL_3: ${{ secrets.NAUKRI_EMAIL_3 }}
          NAUKRI_PASSWORD_3: ${{ secrets.NAUKRI_PASSWORD_3 }}
        run: |
          xvfb-run -a python3 naukri_update.py

      - name: Upload screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
