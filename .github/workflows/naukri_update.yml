name: Naukri Resume Auto Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"  # daily at 06:00 IST (00:30 UTC)

jobs:
  update-naukri:
    runs-on: ubuntu-latest
    env:
      NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
      NAUKRI_EMAIL_1: ${{ secrets.NAUKRI_EMAIL_1 }}
      NAUKRI_EMAIL_2: ${{ secrets.NAUKRI_EMAIL_2 }}
      NAUKRI_EMAIL_3: ${{ secrets.NAUKRI_EMAIL_3 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager selenium-stealth

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Decode cookies
        run: |
          echo "$NAUKRI_COOKIES" | tr -d '\r\n' | base64 --decode > cookies.pkl

      - name: Run Naukri update script with virtual display
        run: xvfb-run -a python3 naukri_update.py

      - name: Upload screenshots (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
