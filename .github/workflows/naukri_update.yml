name: Naukri Resume Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"  # Runs daily at 6:00 AM IST (00:30 UTC)

jobs:
  update-naukri:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager

      - name: Run Naukri update script
        env:
          NAUKRI_EMAIL_1: ${{ secrets.NAUKRI_EMAIL_1 }}
          NAUKRI_PASSWORD_1: ${{ secrets.NAUKRI_PASSWORD_1 }}
          NAUKRI_EMAIL_2: ${{ secrets.NAUKRI_EMAIL_2 }}
          NAUKRI_PASSWORD_2: ${{ secrets.NAUKRI_PASSWORD_2 }}
          NAUKRI_EMAIL_3: ${{ secrets.NAUKRI_EMAIL_3 }}
          NAUKRI_PASSWORD_3: ${{ secrets.NAUKRI_PASSWORD_3 }}
        run: python3 naukri_update.py

      - name: Upload screenshots (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
